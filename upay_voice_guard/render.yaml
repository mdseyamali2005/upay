services:
  - type: web
    name: upay-voice-guard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Optional: Gemini API key for LLM NLU
      - key: GEMINI_API_KEY
        sync: false
      # Optional: Telegram bot token
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Optional: OpenAI Whisper STT
      - key: OPENAI_API_KEY
        sync: false
      # Optional: WhatsApp Business Cloud API
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
    plan: free
    healthCheckPath: /health
    autoDeploy: true
